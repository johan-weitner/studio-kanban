# Staging instance — mirrors production; deployed from main branch for pre-prod testing.
# Secrets: DATABASE_URL, BETTER_AUTH_URL, BETTER_AUTH_SECRET,
#          GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#          SOUNDCLOUD_CLIENT_ID, SOUNDCLOUD_CLIENT_SECRET
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'studio-kanban-stage'
primary_region = 'arn'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
