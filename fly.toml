# Demo instance — single-user, no auth (deployed from main)
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'studio-kanban'
primary_region = 'arn'

[build]
  [build.args]
    VITE_APP_MODE = 'demo'
[env]
  DATABASE_URL = '/data/studio-kanban.db'
  DEMO_MODE = 'true'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'
  headers = { X-Forwarded-Proto = 'https' }

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
